name: Tests and reproducibility

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Unit and loopback tests
        run: python -m unittest discover -s tests -p test_suite.py -v
      - name: Recompute archived experiment
        run: python scripts/audit_legacy.py --root data/legacy --out results/local/legacy
      - name: Compare reference results
        run: python scripts/check_reference.py --actual results/local/legacy --expected results/reference
